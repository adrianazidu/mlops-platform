version: '3.8'

# Common Airflow environment and volume anchors written here one to not be repeated 3 times for 3 airflow containers
x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: "evidently==0.7.23 scikit-learn==1.5.0 boto3==1.34.120 psycopg2-binary==2.9.9 ray[default]==2.24.0"
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - mlops-net

services:
  # 1. Central PostgreSQL Database (Houses Airflow DB, MLflow DB, and Prediction Logs)
  postgres:
    image: postgres:15-alpine
    container_name: mlops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${AIRFLOW_DB},${MLFLOW_DB},${APP_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mlops-net

  # 2. S3-Compatible Object Store (MinIO) - The Storage Server,when MinIO starts with an empty volume, it does not automatically create buckets
  minio:
    image: pgsty/silo:latest
    container_name: mlops-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mlops-net

  # Bucket Auto-Creator, The Setup Worker / MinIO Client, provisions the buckets, and immediately exits with code 0. It does not consume RAM or CPU
  minio-init:
    image: pgsty/silo:latest
    container_name: mlops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/mlflow-artifacts;
      mc mb --ignore-existing local/document-lake;
      exit 0;
      "
    networks:
      - mlops-net

  # 3. MLflow Model Registry
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2-full
    container_name: mlops-mlflow
    restart: always
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${MLFLOW_DB}
      --default-artifact-root s3://mlflow-artifacts
      --artifacts-destination s3://mlflow-artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - mlops-net

  # 4. Ray Distributed Compute Engine - Dashboard, cluster state, and job scheduling
  ray-head:
    image: rayproject/ray:2.30.0-py310
    container_name: mlops-ray-head
    command: >
      bash -c "/home/ray/anaconda3/bin/pip install mlflow==2.13.0 scikit-learn==1.5.0 boto3==1.34.120 'opentelemetry-api>=1.24.0' 'opentelemetry-sdk>=1.24.0' &&
               ray start --head --port=6379 --dashboard-host=0.0.0.0 --dashboard-port=8265 --block"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8265:8265"
      - "6379:6379"
      - "10001:10001"
    volumes:
      - ./training:/home/ray/training
    networks:
      - mlops-net

  #Heavy compute, training, and data workers
  ray-worker:
    image: rayproject/ray:2.30.0-py310
    container_name: mlops-ray-worker
    command: >
      bash -c "/home/ray/anaconda3/bin/pip install mlflow==2.13.0 scikit-learn==1.5.0 boto3==1.34.120 'opentelemetry-api>=1.24.0' 'opentelemetry-sdk>=1.24.0' &&
      ray start --address=ray-head:6379 --block"
    depends_on:
      - ray-head
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./training:/home/ray/training
    networks:
      - mlops-net

  # 5. FastAPI Inference Serving Engine
  serving:
    build:
      context: ./serving
    container_name: mlops-serving
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${APP_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    networks:
      - mlops-net

  # 6. Apache Airflow Orchestration - Applies DB migrations & registers admin user,Runs once & exits
  airflow-init:
    <<: *airflow-common
    container_name: mlops-airflow-init
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com
      "
    depends_on:
      postgres:
        condition: service_healthy

  # airflow Web UI dashboard on :8080
  airflow-webserver:
    <<: *airflow-common
    container_name: mlops-airflow-webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  #DAG evaluation & pipeline orchestration
  airflow-scheduler:
    <<: *airflow-common
    container_name: mlops-airflow-scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # 7. Telemetry & Metrics (Prometheus & Auto-Provisioned Grafana)
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: mlops-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - mlops-net

  grafana:
    image: grafana/grafana:11.0.0
    container_name: mlops-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/dashboards/mlops-overview.json:/var/lib/grafana/dashboards/mlops-overview.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - mlops-net

networks:
  mlops-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
